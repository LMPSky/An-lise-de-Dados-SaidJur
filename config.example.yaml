servidor:
  host: 127.0.0.1     # Mude para 0.0.0.0 para acessar pela rede local
  porta: 8000

banco:
  host: 127.0.0.1
  porta: 3306
  usuario: root
  senha: ""           # Coloque aqui a senha do seu MySQL
  nome: saidjur       # Nome do banco de dados que será criado

busca:
  timeout_segundos: 10
  limite_padrao: 100
  parallelism: 8

documentos:
  # Pasta raiz onde ficam os arquivos do processo (fora do banco), com uma
  # subpasta por número de processo (formato CNJ), ex:
  #   <diretorio_base>/0000003-16.2025.5.07.0015/Processo_....pdf
  # Deixe em branco para desativar a aba de documentos.
  diretorio_base: ""
  habilitado: false
